name: TMAS Scan

on:
  push:

jobs:
  tmas-scan:
    name: TMAS Container Scan
    runs-on: ubuntu-22.04
    steps:
      - name: Download TMAS and scan container for Open Source Vulnerabilities, Malware and Secrets
        uses: trendmicro/tmas-scan-action@v3.1.0
        with:
          version: latest
          vulnerabilitiesScan: true
          malwareScan: true
          secretsScan: true
          artifact: registry:docker.io/vulnerables/web-dvwa:latest
          additionalArgs: --region=ap-southeast-1
          tmasApiKey: ${{ secrets.TMAS_API_KEY }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
